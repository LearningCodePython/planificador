services:
  planificador-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped

    volumes:
      - /var/lib/contel-planificador/data:/app/data
      - /var/lib/contel-planificador/upload:/app/upload

    expose:
      - "3001"

  planificador-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - planificador-api
